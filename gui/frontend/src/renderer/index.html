<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Legacy Robotics</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         connect-src: MediaMTX WebRTC (WHEP) for video, 8889 on the rover and 18889 on the base. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://*:8889 http://*:18889"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
