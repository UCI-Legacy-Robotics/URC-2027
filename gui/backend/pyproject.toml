[project]
name = "gui-backend"
version = "0.1.0"
description = "URC-2027 base station backend: MAVLink radio <-> WebSocket"
authors = [
    { name = "Ethan Shih", email = "ethnj.shih@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pymavlink>=2.4.50",
    "pyserial>=3.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
extend-exclude = ["app/generated"]
