ekf_global:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Wheel odometry: forward velocity and yaw rate.
    odom0: /diff_cont/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]

    # GNSS converted to Cartesian X and Y.
    odom1: /odometry/gps
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false

navsat_transform:
  ros__parameters:
    frequency: 30.0
    zero_altitude: true
    use_odometry_yaw: false
    wait_for_datum: false

    # These values assume true ENU heading with yaw zero facing east.
    yaw_offset: 0.0
    magnetic_declination_radians: 0.0