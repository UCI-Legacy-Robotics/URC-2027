arm_teleop:
  ros__parameters:
    joint_names: [base_mount_to_upper_base, upper_base_to_shoulder, shoulder_to_elbow, elbow_to_wrist, wrist_to_claw]
    command_frame: base_mount
    gripper_enabled: true

    # Four centered joystick axes, unchanged from the existing mapping.
    axes: [0, 1, 2, 3]
    axis_signs: [1.0, -1.0, 1.0, -1.0]

    enable_button: 9
    mode_button: 6
    wrist_negative_button: 13
    wrist_positive_button: 14
    yaw_positive_button: 11
    yaw_negative_button: 12

    # Hold L2 to retract/open; hold R2 to extend/close. Both or neither stops.
    gripper_open_axis: 4
    gripper_close_axis: 5
    gripper_trigger_threshold: 0.5

    gripper_open_position: 0.0
    gripper_closed_position: 0.03  # Existing collision-free partially_closed preset; 0.05 intersects.
    gripper_speed: 0.015  # Leave headroom below Gazebo's 0.02 m/s velocity limit.
    gripper_limit_margin: 0.001  # Stop 1 mm inside each configured endpoint.
    gripper_slowdown_distance: 0.01  # Taper over 10 mm, covering the feedback timeout.

    deadzone: 0.1
    joy_timeout: 0.5
    linear_speed: 0.2
    angular_speed: 0.55
    joint_speed: 0.65
