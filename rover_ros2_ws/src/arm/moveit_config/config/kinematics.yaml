# Only the serial arm chain needs IK. Gripper and Solenoid use joint targets.
# Five DOF cannot reach an arbitrary six-DOF pose; joint targets remain available.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
