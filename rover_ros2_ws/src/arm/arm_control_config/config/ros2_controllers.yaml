controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    solenoid_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: true
    joints:
      - base
      - shoulder
      - elbow
      - wrist_pitch
      - wrist_roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

solenoid_controller:
  ros__parameters:
    allow_nonzero_velocity_at_trajectory_end: true
    joints:
      - solenoid
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
