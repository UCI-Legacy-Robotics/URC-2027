controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: forward_command_controller/ForwardCommandController
    solenoid_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm_controller:
  ros__parameters:
    joints:
    - base_mount_to_upper_base
    - upper_base_to_shoulder
    - shoulder_to_elbow
    - elbow_to_wrist
    - wrist_to_claw
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.02
gripper_controller:
  ros__parameters:
    joints:
    - claw_to_left_grip
    - claw_to_right_grip
    interface_name: velocity
solenoid_controller:
  ros__parameters:
    joints:
    - grip_to_solenoid
    command_interfaces:
    - position
    state_interfaces:
    - position
    - velocity
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: false
    constraints:
      goal_time: 2.0
      stopped_velocity_tolerance: 0.02
      grip_to_solenoid:
        trajectory: 0.01
        goal: 0.001
